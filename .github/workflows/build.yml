name: Build IBRA SAVE

# Every push to main builds the Windows installer and publishes it as release v<version>
# (version comes from package.json). Bump the version to ship an update — the
# installed apps pick it up automatically.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build & publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-SAVE-Setup
          path: dist/*.exe
