<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>IBRA SAVE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<div class="shell">
  <nav class="side glass">
    <div class="brand"><img src="../../assets/icon.png" alt=""><span>IBRA<b>SAVE</b></span></div>
    <button class="nav on" data-page="save"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 19h14"/></svg><span data-i="nav_save"></span></button>
    <button class="nav" data-page="remux"><svg viewBox="0 0 24 24"><path d="M4 7h11l-3-3m8 13H9l3 3"/></svg><span data-i="nav_remux"></span></button>
    <button class="nav" data-page="history"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg><span data-i="nav_history"></span></button>
    <button class="nav" data-page="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10m4 0h2M4 12h4m4 0h8M4 18h12m4 0h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-i="nav_settings"></span></button>
    <button class="nav" data-page="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></svg><span data-i="nav_about"></span></button>
    <div class="side-foot">
      <button id="langBtn" class="mini">EN</button>
      <button id="themeBtn" class="mini" title="theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </nav>

  <main>
    <!-- SAVE -->
    <section class="page on" id="page-save">
      <div class="hero">
        <img class="hero-logo" src="../../assets/icon.png" alt="IBRA SAVE">
        <button class="services-pill" id="servicesBtn"><span>+</span> <em data-i="supported"></em></button>
        <div class="omni glass" id="omni">
          <svg class="link-ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          <input id="url" type="url" spellcheck="false" autocomplete="off" data-ph="placeholder">
          <button id="clearUrl" class="icon-btn hidden" title="clear">×</button>
          <button id="go" class="go" disabled><svg viewBox="0 0 24 24"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg></button>
        </div>
        <div class="row-actions">
          <div class="seg" id="modeSeg">
            <button data-mode="auto"><svg viewBox="0 0 24 24"><path d="M5 12l4-8 4 16 4-8h3"/></svg><span data-i="m_auto"></span></button>
            <button data-mode="audio"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-i="m_audio"></span></button>
            <button data-mode="mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6m0-6-5 6"/></svg><span data-i="m_mute"></span></button>
          </div>
          <button class="paste-btn" id="pasteBtn"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/></svg><span data-i="paste"></span></button>
        </div>
        <div class="preview glass hidden" id="preview"></div>
        <p class="terms" data-i="terms"></p>
      </div>

      <div class="queue" id="queue"></div>
    </section>

    <!-- REMUX -->
    <section class="page" id="page-remux">
      <h1 data-i="remux_title"></h1>
      <p class="sub" data-i="remux_desc"></p>
      <div class="drop glass" id="drop">
        <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <p data-i="drop"></p>
        <span id="remuxFile" class="file-name"></span>
      </div>
      <div class="field-row">
        <label data-i="container"></label>
        <div class="seg small" id="containerSeg">
          <button data-v="same" class="on" data-i="same"></button>
          <button data-v="mp4">MP4</button><button data-v="mkv">MKV</button><button data-v="mov">MOV</button><button data-v="webm">WEBM</button>
        </div>
      </div>
      <button class="primary" id="remuxGo" disabled data-i="remux_go"></button>
      <div class="bar hidden" id="remuxBar"><i></i></div>
      <p class="status" id="remuxStatus"></p>
    </section>

    <!-- HISTORY -->
    <section class="page" id="page-history">
      <div class="head-row"><h1 data-i="nav_history"></h1><button class="ghost" id="clearHist" data-i="clear"></button></div>
      <div id="historyList" class="list"></div>
    </section>

    <!-- SETTINGS -->
    <section class="page" id="page-settings">
      <h1 data-i="nav_settings"></h1>
      <div class="card glass">
        <h3 data-i="s_video"></h3>
        <div class="field-row"><label data-i="s_quality"></label>
          <div class="seg small wrap" data-key="quality">
            <button data-v="max" data-i="max"></button><button data-v="4320">8K</button><button data-v="2160">4K</button><button data-v="1440">1440</button><button data-v="1080">1080</button><button data-v="720">720</button><button data-v="480">480</button><button data-v="360">360</button><button data-v="240">240</button><button data-v="144">144</button>
          </div></div>
        <div class="field-row"><label data-i="s_codec"></label>
          <div class="seg small" data-key="codec"><button data-v="h264">H264 (MP4)</button><button data-v="av1">AV1 (MP4)</button><button data-v="vp9">VP9 (WEBM)</button></div></div>
        <p class="hint" data-i="s_codec_hint"></p>
        <label class="switch"><input type="checkbox" data-key="subtitles"><i></i><span data-i="s_subs"></span></label>
      </div>
      <div class="card glass">
        <h3 data-i="s_audio"></h3>
        <div class="field-row"><label data-i="s_aformat"></label>
          <div class="seg small wrap" data-key="audioFormat"><button data-v="best" data-i="best"></button><button data-v="mp3">MP3</button><button data-v="m4a">M4A</button><button data-v="ogg">OGG</button><button data-v="opus">OPUS</button><button data-v="wav">WAV</button></div></div>
        <div class="field-row"><label data-i="s_bitrate"></label>
          <div class="seg small wrap" data-key="audioBitrate"><button data-v="320">320</button><button data-v="256">256</button><button data-v="128">128</button><button data-v="96">96</button><button data-v="64">64</button><button data-v="8">8</button></div></div>
        <label class="switch"><input type="checkbox" data-key="embedThumbnail"><i></i><span data-i="s_cover"></span></label>
      </div>
      <div class="card glass">
        <h3 data-i="s_files"></h3>
        <div class="field-row"><label data-i="s_folder"></label>
          <div class="folder"><span id="folderPath"></span><button class="ghost" id="pickFolder" data-i="change"></button><button class="ghost" id="openFolder" data-i="open"></button></div></div>
        <div class="field-row"><label data-i="s_fname"></label>
          <div class="seg small wrap" data-key="filenameStyle"><button data-v="classic" data-i="fn_classic"></button><button data-v="basic" data-i="fn_basic"></button><button data-v="pretty" data-i="fn_pretty"></button><button data-v="nerdy" data-i="fn_nerdy"></button></div></div>
        <p class="hint" id="fnPreview"></p>
        <label class="switch"><input type="checkbox" data-key="embedMetadata"><i></i><span data-i="s_meta"></span></label>
        <label class="switch"><input type="checkbox" data-key="allowPlaylist"><i></i><span data-i="s_playlist"></span></label>
        <label class="switch"><input type="checkbox" data-key="autoPasteOnFocus"><i></i><span data-i="s_autopaste"></span></label>
        <div class="field-row"><label data-i="s_concurrent"></label>
          <div class="seg small" data-key="maxConcurrent"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
      </div>
      <div class="card glass">
        <h3 data-i="s_engine"></h3>
        <div class="field-row"><label data-i="s_engine_ver"></label><span id="engineVer" class="mono">—</span></div>
        <button class="ghost" id="updEngine" data-i="s_engine_upd"></button>
        <p class="hint" id="engineMsg"></p>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="page" id="page-about">
      <div class="about glass">
        <img src="../../assets/icon.png" alt="">
        <h1>IBRA SAVE</h1>
        <p class="mono" id="appVer"></p>
        <p data-i="about_text"></p>
        <ul class="about-list">
          <li data-i="ab1"></li><li data-i="ab2"></li><li data-i="ab3"></li><li data-i="ab4"></li>
        </ul>
        <p class="credit" data-i="credit"></p>
        <div class="links">
          <button class="primary" data-url="https://t.me/ibraprogram">Telegram · t.me/ibraprogram</button>
          <button class="ghost" data-url="https://www.tiktok.com/@ibraprogram">TikTok · @ibraprogram</button>
        </div>
        <p class="hint" data-i="about_thanks"></p>
      </div>
    </section>
  </main>
</div>

<div class="modal hidden" id="servicesModal">
  <div class="modal-card glass">
    <div class="head-row"><h3 data-i="supported"></h3><button class="icon-btn" data-close>×</button></div>
    <div class="chips" id="servicesList"></div>
    <p class="hint" data-i="services_note"></p>
  </div>
</div>

<div class="engine-overlay hidden" id="engineOverlay">
  <div class="glass modal-card center">
    <img src="../../assets/icon.png" alt="" class="spin-soft">
    <p data-i="engine_setup"></p>
    <div class="bar"><i id="engineBar"></i></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<div class="update-bar hidden" id="updateBar"></div>

<script src="app.js"></script>
</body>
</html>
