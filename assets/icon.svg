<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- white/silver glass tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#eceef2"/>
      <stop offset="1" stop-color="#b9bdc6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8d929c"/>
    </linearGradient>
    <!-- red glass core -->
    <radialGradient id="core" cx=".38" cy=".28" r=".85">
      <stop offset="0" stop-color="#ff6a78"/>
      <stop offset=".35" stop-color="#f01d33"/>
      <stop offset=".75" stop-color="#b20b1e"/>
      <stop offset="1" stop-color="#6e0410"/>
    </radialGradient>
    <linearGradient id="coreShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="600">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e9ee"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c33"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feFlood flood-color="#7a0010" flood-opacity=".45"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8"/>
      <feFlood flood-color="#5a000b" flood-opacity=".55"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="coreClip"><circle cx="512" cy="430" r="268"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#drop)">
    <rect x="72" y="60" width="880" height="880" rx="196" fill="url(#rim)"/>
    <rect x="80" y="68" width="864" height="864" rx="190" fill="url(#tile)"/>
    <path d="M270 76 H754 A186 186 0 0 1 936 262 V330 C760 420 300 300 88 430 V262 A186 186 0 0 1 270 76Z" fill="url(#tileShine)" opacity=".7"/>
  </g>

  <!-- red glass core -->
  <g filter="url(#soft)">
    <circle cx="512" cy="430" r="268" fill="url(#core)"/>
    <circle cx="512" cy="430" r="266" fill="none" stroke="#ff9aa4" stroke-opacity=".55" stroke-width="4"/>
  </g>
  <g clip-path="url(#coreClip)">
    <ellipse cx="490" cy="250" rx="230" ry="120" fill="url(#coreShine)" opacity=".55"/>
    <circle cx="700" cy="640" r="160" fill="#ff3b4e" opacity=".18"/>
  </g>

  <!-- arrow dropping into tray, with chain link (paste link → save) -->
  <g filter="url(#arrowShadow)">
    <!-- link ring on the shaft -->
    <path d="M512 232 v170" stroke="url(#arrow)" stroke-width="64" stroke-linecap="round" fill="none"/>
    <path d="M404 384 L512 492 L620 384" stroke="url(#arrow)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M362 516 v38 a26 26 0 0 0 26 26 h248 a26 26 0 0 0 26 -26 v-38" stroke="url(#arrow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- small chain link badge -->
  <g transform="translate(676 238) rotate(-45)">
    <circle cx="0" cy="0" r="66" fill="#ffffff" stroke="#d8dbe1" stroke-width="4"/>
    <rect x="-44" y="-18" width="52" height="36" rx="18" fill="none" stroke="#e0162b" stroke-width="12"/>
    <rect x="-8" y="-18" width="52" height="36" rx="18" fill="none" stroke="#e0162b" stroke-width="12"/>
  </g>

  <!-- wordmark -->
  <g font-family="Montserrat, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="822" font-size="112" letter-spacing="6" fill="url(#word)">IBRA<tspan dx="34" fill="#e0162b">SAVE</tspan></text>
  </g>
</svg>
